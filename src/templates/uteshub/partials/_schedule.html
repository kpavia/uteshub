<section id="schedule" class="card shadow-sm" aria-labelledby="schedule-heading">
  <div class="card-body p-3 p-md-4 pb-md-2">
    <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2 mb-2">
      <h2 id="schedule-heading" class="uh-display uh-section-title text-uppercase mb-0">{{ season }} {{ featured_sport.name|lower }} schedule</h2>
      {% if calendar_url %}<a class="fw-bold uh-link py-2" href="{{ calendar_url }}">Subscribe to calendar</a>{% endif %}
    </div>
    {% if schedule %}
      <ul class="list-group list-group-flush">
        {% for game in schedule %}
          {% include "uteshub/partials/_game_row.html" %}
        {% endfor %}
      </ul>
    {% else %}
      <p class="text-muted mb-3">The schedule hasn't been announced yet.</p>
    {% endif %}
  </div>
</section>
